<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='style.css'><link rel='manifest' href='manifest.json'><title>Shift Tracker</title></head><body><header><b>Shift Tracker</b><button onclick='logout()'>Logout</button></header><div class='container'><div class='card'><h3 id='shiftStatus'>Checking shift...</h3></div><div class='card'><h3>Add Entry</h3><input id='employee_name' placeholder='Employee name'><input id='check_in_time' type='time'><input id='phone_number' placeholder='0712345678'><input id='location' placeholder='Location'><textarea id='notes' placeholder='Notes'></textarea><button id='submitBtn'>Submit</button></div><div class='card table-wrap'><table><thead><tr><th>Date</th><th>Shift</th><th>Name</th><th>Time</th><th>Phone</th><th>Location</th></tr></thead><tbody id='entries'></tbody></table></div></div><div class='toast' id='toast'></div><script src='script.js'></script></body></html>
